name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  go:
    name: Go (build, vet, format, test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kirch
          POSTGRES_PASSWORD: kirch
          POSTGRES_DB: kirch
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kirch" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      # Database tests must run here, never skip.
      KIRCH_TEST_DATABASE_URL: postgres://kirch:kirch@localhost:5432/kirch?sslmode=disable
      KIRCH_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go test ./... -race -count=1
      - name: Server end-to-end (kirch:// push / pull + HTTP API)
        env:
          KIRCH_DATABASE_URL: postgres://kirch:kirch@localhost:5432/kirch?sslmode=disable
        run: scripts/e2e-server.sh

  server-image:
    name: Server image (docker compose end-to-end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: E2E_DOCKER=1 scripts/e2e-server.sh

  firmware-host-tests:
    name: Firmware logic tests (no ESP32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - working-directory: firmware
        run: g++ -std=c++17 -Wall -Wextra -Werror -Iinclude test/test_host.cpp -o test_host && ./test_host

  firmware-build:
    name: Firmware compile (ESP32-S3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - working-directory: firmware
        run: pio run
