name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  go:
    name: Go (build, vet, format, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go test ./... -race -count=1

  firmware-host-tests:
    name: Firmware logic tests (no ESP32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - working-directory: firmware
        run: g++ -std=c++17 -Wall -Wextra -Werror -Iinclude test/test_host.cpp -o test_host && ./test_host

  firmware-build:
    name: Firmware compile (ESP32-S3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - working-directory: firmware
        run: pio run
