; Kirch probe module — ESP32-S3 with two OLED screens.
; Readings go out over Wi-Fi (WebSocket on port 81, host kirch-probe.local).
;   esp32s3       logs on the native "USB" port
;   esp32s3-uart  logs on the "UART" port (CH343), e.g. when only that port is plugged in

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 4MB
; Two app slots (needed for OTA later) and room for Wi-Fi + BLE provisioning.
board_build.partitions = min_spiffs.csv
lib_deps =
  bblanchon/ArduinoJson@^7.4.2
  links2004/WebSockets@^2.6.1
  adafruit/Adafruit SSD1306@^2.5.13
  adafruit/Adafruit GFX Library@^1.11.11
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DKIRCH_FIRMWARE_VERSION=\"0.2.0\"

[env:esp32s3-uart]
extends = env:esp32s3
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DKIRCH_FIRMWARE_VERSION=\"0.2.0\"
