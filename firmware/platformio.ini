; Kirch Wi-Fi probe — ESP32-S3.
; USB is only used to flash the very first firmware and to read boot logs.
; Readings go out over Wi-Fi (WebSocket on port 81, host kirch-probe.local).

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 4MB
; Two app slots (needed for OTA later) and room for Wi-Fi + BLE provisioning.
board_build.partitions = min_spiffs.csv
lib_deps =
  bblanchon/ArduinoJson@^7.4.2
  links2004/WebSockets@^2.6.1
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DKIRCH_FIRMWARE_VERSION=\"0.1.0\"
